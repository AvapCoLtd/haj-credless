# haj-credless の CI。ビルド物は無い — GitHub への公開ミラーだけ。
#
#   master / tag → mirror (GitHub: AvapCoLtd/haj-credless)
#
# GitHub 連携は CI 変数 GH_APP_ID / GH_APP_PRIVATE_KEY があるときだけ走る
# (ci/github.sh 参照。App: haj-release、鍵の正は bao)。

mirror:
  image: avap.plus/dockerhub/library/alpine:3
  before_script:
    - apk add --no-cache git curl openssl >/dev/null
  script:
    - sh ci/github.sh mirror
  rules:
    - if: '$GH_APP_ID == null'
      when: never
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH